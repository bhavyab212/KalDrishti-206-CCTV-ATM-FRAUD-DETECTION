worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # DoS / Flooding Defense: Per-IP Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Enforce strict DVR upload limit (4 GB max per clip)
    client_max_body_size 4096M;

    upstream fastapi_backend {
        server fastapi:8000;
    }

    server {
        listen 80;
        server_name atm-forensics.internal localhost;

        # Production Server Mode enforces TLS 1.3 + internal VPN/mTLS on port 443:
        # ssl_protocols TLSv1.3;

        location / {
            root /usr/share/nginx/html;
            index prototype/index.html;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/v1/jobs/ {
            # WebSocket live progress streaming
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
        }
    }
}
